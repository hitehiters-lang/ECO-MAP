basePath: /
definitions:
  schemas.AirMeasurements:
    properties:
      ch2O:
        type: number
      co:
        type: number
      coordX:
        type: number
      coordY:
        type: number
      createdAt:
        type: string
      cxhy:
        type: number
      h2S:
        type: number
      humidityPct:
        type: number
      id:
        type: integer
      "no":
        type: number
      no2:
        type: number
      pm10:
        type: number
      pm25:
        type: number
      pointID:
        type: string
      pointName:
        type: string
      pressureMmhg:
        type: number
      rsh:
        type: number
      sampleDatetime:
        type: string
      sampleTime:
        type: string
      so2:
        type: number
      temperatureC:
        type: number
      vv:
        type: number
      windDirection:
        type: string
      windSpeedMs:
        type: number
    type: object
info:
  contact: {}
  description: Документация к API.
  title: Eco Map API 2
  version: "0.1"
paths:
  /api/air/measurements:
    get:
      consumes:
      - application/json
      description: Возвращает все пробы воздуха за дату ДО и ПОСЛЕ
      operationId: air_measurements
      parameters:
      - default: "2024-02-01"
        description: Дата с (YYYY-MM-DD)
        example: "2024-02-01"
        in: query
        name: date_from
        required: true
        type: string
      - default: "2024-02-28"
        description: Дата до (YYYY-MM-DD)
        example: "2024-02-28"
        in: query
        name: date_to
        required: true
        type: string
      - description: Время пробы
        enum:
        - "01:00"
        - "07:00"
        - "12:00"
        - "18:00"
        in: query
        name: time
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/schemas.AirMeasurements'
            type: array
        "400":
          description: '{"error": "bad datetime request"}'
        "404":
          description: '{"error": "air samples not found"}'
      summary: Получить все пробы воздуха за период времени
      tags:
      - Пробы
swagger: "2.0"
