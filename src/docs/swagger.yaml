paths:
  /api/air/measurements:
    get:
      consumes:
      - application/json
      description: Возвращает все пробы воздуха за дату ДО и ПОСЛЕ
      operationId: air_measurements
      parameters:
      - default: "2024-02-01"
        description: Дата с (YYYY-MM-DD)
        example: "2024-02-01"
        in: query
        name: date_from
        type: string
      - default: "2024-02-28"
        description: Дата до (YYYY-MM-DD)
        example: "2024-02-28"
        in: query
        name: date_to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/schemas.AirMeasurements'
            type: array
        "400":
          description: Bad Request
          schema:
            items:
              additionalProperties:
                type: string
              type: object
            type: array
        "404":
          description: Not Found
          schema:
            items:
              additionalProperties:
                type: string
              type: object
            type: array
      summary: Получить все пробы воздуха за период времени
      tags:
      - Пробы
    post:
      consumes:
      - application/json
      description: Возвращает ОК если проба успешно добавлена в БД
      operationId: add_measurements
      parameters:
      - description: Данные пробы
        in: body
        name: comment
        required: true
        schema:
          $ref: '#/definitions/models.AirMeasurements'
      produces:
