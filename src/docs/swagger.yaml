basePath: /
definitions:
  models.Category:
    properties:
      id:
        type: integer
      is_container_yard:
        type: boolean
      name:
        type: string
    type: object
  models.Measure:
    properties:
      ch2o:
        type: number
      co:
        type: number
      coord_x:
        type: number
      coord_y:
        type: number
      created_at:
        type: string
      cxhy:
        type: number
      h2s:
        type: number
      humidity_pct:
        type: number
      id:
        type: integer
      "no":
        type: number
      no2:
        type: number
      pm10:
        type: number
      pm25:
        type: number
      point_id:
        type: string
      point_name:
        type: string
      pressure_mmhg:
        type: number
      r_sh:
        type: number
      sample_datetime:
        type: string
      sample_time:
        type: string
      so2:
        type: number
      temperature_c:
        type: number
      vv:
        type: number
      wind_direction:
        type: string
      wind_speed_ms:
        type: number
    type: object
  models.Organization:
    properties:
      category_id:
        type: integer
      city_id:
        type: integer
      id:
        type: integer
      name:
        type: string
    type: object
info:
  contact: {}
  description: Документация к API.
  title: Eco Map API 2
  version: "0.12"
paths:
  /api/air/measurements:
    get:
      consumes:
      - application/json
      description: Возвращает все пробы воздуха за дату ДО и ПОСЛЕ
      operationId: air_measurements
      parameters:
      - default: "2024-02-01"
        description: Дата с (YYYY-MM-DD)
        example: "2024-02-01"
        in: query
        name: date_from
        required: true
        type: string
      - default: "2024-02-28"
        description: Дата до (YYYY-MM-DD)
        example: "2024-02-28"
        in: query
        name: date_to
        required: true
        type: string
      - description: Время пробы
        enum:
        - "01:00"
        - "07:00"
        - "12:00"
        - "18:00"
        in: query
        name: time
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Measure'
            type: array
        "400":
          description: '{"error": "bad datetime request"}'
        "404":
          description: '{"error": "air samples not found"}'
      summary: Получить все пробы воздуха за период времени
      tags:
      - Пробы
  /api/categories/list:
    get:
      consumes:
      - application/json
      description: Возвращает все категории организаций и контейнерных площадок
      operationId: get_categories
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Category'
            type: array
        "404":
          description: '{"error": "categories not found"}'
      summary: Получить все категории
      tags:
      - Категории
  /api/orgs/{city_id}:
    get:
      consumes:
      - application/json
      description: Возвращает все организации в городе
      operationId: get_organizations
      parameters:
      - default: 1
        description: ID города
        example: 1
        in: path
        name: city_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Organization'
            type: array
        "400":
          description: '{"error": "bad city id request"}'
        "404":
          description: '{"error": "organizations not found"}'
      summary: Получить все организации в определённом городе
      tags:
      - Организации
swagger: "2.0"
