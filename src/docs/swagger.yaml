info:
  contact: {}
  description: Документация к API.
  title: Eco Map API 2
  version: "0.2"
paths:
  /api/air/measurements:
    get:
      consumes:
      - application/json
      description: Возвращает все пробы воздуха за дату ДО и ПОСЛЕ
      operationId: air_measurements
      parameters:
      - default: "2024-02-01"
        description: Дата с (YYYY-MM-DD)
        example: "2024-02-01"
        in: query
        name: date_from
        required: true
        type: string
      - default: "2024-02-28"
        description: Дата до (YYYY-MM-DD)
        example: "2024-02-28"
        in: query
        name: date_to
        required: true
        type: string
      - description: Время пробы
        enum:
        - "01:00"
        - "07:00"
        - "12:00"
        - "18:00"
        in: query
        name: time
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Measure'
            type: array
        "400":
          description: '{"error": "bad datetime request"}'
        "404":
          description: '{"error": "air samples not found"}'
      summary: Получить все пробы воздуха за период времени
      tags:
      - Пробы
  /api/auth/login:
    post:
      consumes:
      - application/json
      description: Вход по логину и паролю. Возвращает JWT
      operationId: log_in
      parameters:
      - description: Данные пользователя
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/models.LoginBody'
      produces:
      - application/json
      responses:
        "200":
          description: '{"token": "token", "type": "bearer"}'
        "400":
          description: '{"error": "bad request"}'
        "404":
          description: '{"error": "invalid credentials"}'
        "500":
          description: '{"error": "internal server error"}'
      summary: Войти
      tags:
      - Аутентификация
  /api/categories/list:
    get:
      consumes:
      - application/json
      description: Возвращает все категории организаций и контейнерных площадок
      operationId: get_categories
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Category'
            type: array
        "404":
          description: '{"error": "categories not found"}'
      summary: Получить все категории
      tags:
      - Категории
  /api/cities/list:
    get:
      consumes:
      - application/json
      description: Возвращает список всех городов
      operationId: get_cities
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.City'
            type: array
        "404":
          description: '{"error": "cities not found"}'
      summary: Получить все города
      tags:
      - Города
  /api/orgs/{city_id}:
    get:
      consumes:
      - application/json
      description: Возвращает все организации в городе
      operationId: get_organizations
      parameters:
      - default: 1
        description: ID города
        example: 1
        in: path
        name: city_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Organization'
            type: array
        "400":
          description: '{"error": "bad city id request"}'
        "404":
          description: '{"error": "organizations not found"}'
      summary: Получить все организации в определённом городе
      tags:
      - Организации
  /api/users/{user_id}:
    delete:
      consumes:
      - application/json
      description: Удаление пользователя из БД. Доступно только superuser. Не может
        удалять других superuser
      operationId: delete_user
      parameters:
      - description: ID пользователя
        in: path
        name: user_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: '{"message": "user successfully deleted"}'
        "400":
          description: '{"error": "bad request"}'
        "401":
          description: '{"error": "unauthorized"}'
        "403":
          description: '{"error": "not superuser"}, {"error": "superuser can''t delete
            superuser"}'
        "404":
          description: '{"error": "user not found"}'
        "500":
          description: '{"error": "internal server error"}'
      security:
      - BearerAuth: []
      summary: Удалить пользователя (superuser)
      tags:
      - Пользователи
  /api/users/add:
    post:
      consumes:
      - application/json
      description: Создание нового пользователя в БД. Доступно только superuser. Возвращает
        данные о созданном пользователе
      operationId: add_user
      parameters:
      - description: Данные нового пользователя
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/models.AddUserBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.UserPublic'
        "400":
          description: '{"error": "bad request"}, {"error": "login is not unique"}'
        "401":
          description: '{"error": "unauthorized"}'
        "403":
          description: '{"error": "not superuser"}'
        "500":
          description: '{"error": "internal server error"}'
      security:
      - BearerAuth: []
      summary: Добавить пользователя (superuser)
      tags:
      - Пользователи
  /api/users/list:
    get:
      consumes:
      - application/json
      description: Возвращает список всех пользователей
      operationId: get_users
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.UserPublic'
            type: array
        "401":
          description: '{"error": "unauthorized"}'
        "403":
          description: '{"error": "not superuser"}'
        "404":
          description: '{"error": "users not found"}'
      security:
      - BearerAuth: []
      summary: Получить всех пользователей
      tags:
      - Пользователи
  /api/users/me:
    get:
      consumes:
      - application/json
      description: Возвращает данные о своём пользователе из Authorization
      operationId: me_user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.UserPublic'
        "401":
          description: '{"error": "unauthorized"}'
      security:
      - BearerAuth: []
      summary: Посмотреть данные о себе
      tags:
      - Аутентификация
  /ws/sensors:
    get:
      consumes:
      - application/json
      description: Пример вебсокета. Сам роут не работает
      operationId: sensors_ws
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Sensor'
            type: array
        "400":
          description: Bad Request
      summary: Получение резултатов датчика (Websocket)
      tags:
      - Датчики
securityDefinitions:
  BearerAuth:
    description: Введите JWT токен
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
